[project]
name = "loopsatellite-backend"
version = "0.1.0"
description = "LoopSatellite backend — wetland water-surface anomaly detection and case building"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "httpx>=0.27",
    "openai>=1.40",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    # Session verification. The API checks the token itself rather than trusting
    # the UI's route guard — see app/core/auth.py. Pure Python plus `cryptography`.
    "PyJWT[crypto]>=2.9",
    # Geodesic circles for radius search. app/core/geo.py has a spherical
    # fallback if this is missing, but the ellipsoid is the correct answer.
    "pyproj>=3.6",
]

[project.optional-dependencies]
# What a deployed server needs BEYOND the read path: the slow "process a new
# area" job runs detection in-process and calls Earth Engine.
# The fast path — the map, the queue, reports, and every question an officer can
# ask — needs none of this.
server = [
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "earthengine-api>=1.0",
]
# The full offline pipeline, run from a developer machine. Never on the server.
pipeline = [
    "loopsatellite-backend[server]",
    "pandas>=2.2",
    "geeup>=0.5",
    "shapely>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a default is the FastAPI idiom, not a mutable-default bug.
"app/api/routes/*.py" = ["B008"]
# A notice is dated in local civil time, which is what date.today() gives.
"app/services/llm/regulatory_rag.py" = ["DTZ011"]
# One malformed pond must not abort a 42-pond batch run.
"data_pipeline/05_stl_esd_flagging.py" = ["BLE001"]
