# Render blueprint. Deploy with: New > Blueprint > point at this repository.
#
# Secrets are NOT in this file. Set them in the Render dashboard:
#   DATABASE_URL                 Neon connection string, pasted as Neon prints it
#   OPENROUTER_API_KEY           OpenRouter key
#   OPENROUTER_MODEL             e.g. anthropic/claude-sonnet-4.5
#   EARTHENGINE_CREDENTIALS_JSON whole ~/.config/earthengine/credentials, one line
#   GEE_PROJECT_ID               your Earth Engine cloud project
#   CORS_ORIGINS                 the Vercel URL, e.g. https://loopsatellite.vercel.app
services:
  - type: web
    name: loopsatellite-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: OPENROUTER_APP_NAME
        value: LoopSatellite
      # tavily: real search results are fetched server-side and handed to the
      # model, rather than trusting an :online model to retrieve well. Needs
      # SEARCH_API_KEY. Set to "none" to switch evidence corroboration off.
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: EARTHENGINE_CREDENTIALS_JSON
        sync: false
      - key: GEE_PROJECT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Sessions. Left OFF: Managed Better Auth is not enabled on the Neon branch,
      # and AUTH_REQUIRED=true with no NEON_AUTH_URL makes the app refuse to boot
      # by design. The API therefore runs open and says so at /api/health, and the
      # front door offers "Continue as demo" — which is how a judge gets in.
      #
      # To turn sign-in on later: enable Auth on the branch, set NEON_AUTH_URL
      # here and VITE_NEON_AUTH_URL on Vercel, then flip AUTH_REQUIRED to "true".
      - key: NEON_AUTH_URL
        sync: false
      - key: AUTH_REQUIRED
        value: "false"

# NOTE on the slow path: `POST /api/areas` runs its job inside this web service
# via FastAPI BackgroundTasks. Render's free tier sleeps on inactivity and would
# kill a job mid-flight; `starter` above does not sleep. If area processing ever
# becomes load-bearing, move it to a Background Worker with a queue rather than
# relying on the web process staying alive.
