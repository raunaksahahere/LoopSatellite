# Render blueprint. Deploy with: New > Blueprint > point at this repository.
#
# Secrets are NOT in this file. Set them in the Render dashboard:
#   DATABASE_URL                 Neon connection string, pasted as Neon prints it
#   GEMINI_API_KEY               Google AI Studio key (aistudio.google.com/apikey)
#   CLERK_ISSUER                 Clerk Frontend API URL, e.g.
#                                https://sound-pelican-42.clerk.accounts.dev
#   EARTHENGINE_CREDENTIALS_JSON whole ~/.config/earthengine/credentials, one line
#   GEE_PROJECT_ID               your Earth Engine cloud project
#   CORS_ORIGINS                 the Vercel URL, e.g. https://loopsatellite.vercel.app
services:
  - type: web
    name: loopsatellite-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free
    envVars:
      # gemini-2.0-flash-lite is retired and 404s. Pinned rather than using
      # gemini-flash-lite-latest: a model that floats changes the prose in a
      # warmed cache underneath you.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Bounds on one completion, so a stalled or rate-limited free tier degrades
      # to the deterministic answer instead of holding a request open for minutes.
      - key: LLM_REQUEST_TIMEOUT
        value: "30"
      - key: LLM_TOTAL_BUDGET
        value: "75"
      # tavily: real search results are fetched server-side and handed to the
      # model, rather than trusting an :online model to retrieve well. Needs
      # SEARCH_API_KEY. Set to "none" to switch evidence corroboration off.
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EARTHENGINE_CREDENTIALS_JSON
        sync: false
      - key: GEE_PROJECT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Sessions, via Clerk. There is no "Continue as demo" any more: Clerk offers
      # sign-up, so a visitor with no account can make one, and the demo header
      # that used to read the whole API without one is gone.
      #
      # CLERK_ISSUER is the Frontend API URL from the Clerk dashboard. It is the
      # `iss` of every token and the root of the JWKS this API verifies against.
      # Set VITE_CLERK_PUBLISHABLE_KEY on Vercel to match.
      - key: CLERK_ISSUER
        sync: false
      # Clerk stamps the origin a token was minted for into `azp`. Setting this to
      # the Vercel URL refuses a token lifted from this instance and replayed from
      # somebody else's page. Comma-separated; blank disables the check.
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Flip to "true" once CLERK_ISSUER is set. The app then refuses to boot
      # unconfigured rather than quietly serving everything to everyone — which
      # is what a deployment should do, and why it is off until the key is in.
      - key: AUTH_REQUIRED
        value: "false"

      # Earth Engine spend. POST /api/areas starts a real satellite pull billed to
      # a personal OAuth token, and any signed-in user may call it — so it is
      # capped over a rolling 24 hours, per person and per deployment. Counted in
      # Postgres, not in memory: this service sleeps on the free tier and may run
      # more than one worker. 0 disables a cap.
      - key: AREA_QUOTA_PER_USER_PER_DAY
        value: "3"
      - key: AREA_QUOTA_PER_DAY
        value: "20"

# NOTE on the slow path: `POST /api/areas` runs its job inside this web service
# via FastAPI BackgroundTasks. Render's free tier sleeps on inactivity and would
# kill a job mid-flight; `starter` above does not sleep. If area processing ever
# becomes load-bearing, move it to a Background Worker with a queue rather than
# relying on the web process staying alive.
